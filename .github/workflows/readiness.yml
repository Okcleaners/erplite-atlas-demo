name: Website readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/atlas-website-cloudflare-001]

permissions:
  contents: read

jobs:
  validate:
    name: Website readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm run check
